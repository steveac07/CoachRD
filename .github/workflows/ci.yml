name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      # El cálculo de objetivos se prueba contra calc() de la demo: si la demo cambia, hay que regenerarlo.
      - name: Los resultados esperados coinciden con la demo actual
        run: npm run golden:demo && git diff --exit-code -- lib/nutrition/__tests__/demo-calc.golden.json

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Deno llega como devDependency (npm) para usar la misma versión en Windows y en el CI.
      - run: npm ci
      - run: npm run fn:check
      - run: npm run fn:lint
      - run: npm run fn:fmt
      - run: npm run fn:test

  database:
    name: Migraciones y tipos de Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Aplica todas las migraciones, en orden, sobre una base de datos vacía.
      - run: npm run db:start
      # Tests de RLS y funciones SQL (pgTAP) en supabase/tests/
      - run: npm run db:test
      # Si alguien cambia una migración y no regenera los tipos, el job falla.
      - run: npm run gen:types:local
      - name: Los tipos de la app y de las Edge Functions coinciden con las migraciones
        run: git diff --exit-code -- types/database.ts supabase/functions/_shared/database.types.ts
