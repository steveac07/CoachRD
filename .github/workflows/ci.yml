name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci

  database:
    name: Migraciones y tipos de Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Aplica todas las migraciones, en orden, sobre una base de datos vacía.
      - run: npm run db:start
      # Si alguien cambia una migración y no regenera los tipos, el job falla.
      - run: npm run gen:types:local
      - name: types/database.ts coincide con las migraciones
        run: git diff --exit-code -- types/database.ts
