# Netlify publica la demo aprobada como página de inicio.
# Solo se copia el HTML: ni las migraciones ni las Edge Functions (supabase/) se publican.
#
# Cuando la app Expo sustituya a la demo, cambia a:
#   command = "npx expo export -p web"
#   (y define EXPO_PUBLIC_SUPABASE_URL y EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY en Netlify)
# y añade a `ignore` las carpetas de la app (app/, components/, lib/, ...).
[build]
  command = "mkdir -p dist && cp referencia/coachrd-demo.html dist/index.html"
  publish = "dist"
  # Ahorro de créditos: cada deploy a producción cuesta créditos y Netlify solo publica la demo.
  # Si en el commit no cambia nada de lo que se publica, el build se cancela (salir con 0 = no construir).
  # Para forzar un deploy: «Trigger deploy» en Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- referencia/coachrd-demo.html netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
